[project]
name = "gymbro-vision-service"
version = "0.1.0"
description = "FastAPI, OpenCV and MediaPipe service for GymBro"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
    "opencv-python>=4.10,<4.12",
    "mediapipe>=0.10.20,<0.11",
    "numpy>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
